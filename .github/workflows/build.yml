name: Build All Platforms
run-name: "Build All Platforms: ${{ github.actor }}"
on:
  push:
    tags:
      - "v*"
    branches: [master]
  pull_request:
    branches: [master]
jobs:
   pack-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ETF repo
        uses: actions/checkout@v7
      - name: Download sgforge (Linux release)
        run: |
          curl -L \
            https://github.com/kjblanchard/sgforge/releases/download/v0.1.5/sgforge-linux.tar.gz \
            -o sgforge.tar.gz
          tar -xzf sgforge.tar.gz
          echo "Contents after extraction:"
          find . -maxdepth 3 -type f

          chmod +x sgforge || true
      - name: Pack assets
        run: |
          # either use make:
          make pack SGFORGE=./sgforge
          # OR directly:
          # ./sgforge $ALL_FILES_STRING -o etf.sg
      - name: Upload packed asset
        uses: actions/upload-artifact@v7
        with:
          name: etf-assets
          path: etf.sg
   Build-Desktop:
    needs: pack-assets
    strategy:
      matrix:
        include:
          - os: windows-2025
            make_cmd: wrebuild
            name: win
          - os: macos-latest
            make_cmd: xrebuild
            name: mac
          # - os: macos-latest
          #   make_cmd: irebuild
          #   name: ios-simulator
          - os: ubuntu-latest
            make_cmd: brebuild
            name: linux
    runs-on: ${{ matrix.os }}
    environment: prod
    steps:
      - name: Checkout ETF repo
        uses: actions/checkout@v7
      - name: Download packed assets
        uses: actions/download-artifact@v7
        with:
          name: etf-assets
          path: .
      - name: Install dependencies (Ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update -y
          sudo apt-get install build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libxtst-dev
      - name: Install dependencies (Windows only)
        if: ${{ matrix.os == 'windows-2025' }}
        run: |
          choco install nsis -y
      - name: Set version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.2.0" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Configure CMake
        run: make BUILD_TYPE=Release IMGUI_DEBUGGING=OFF STEAM_ENABLED=OFF SYSTEM_PACKAGES=OFF ENGINE_CACHED=OFF GAME_VERSION=${{ steps.version.outputs.value }} ${{ matrix.make_cmd}}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-packages
          path: |
            build/packages/*.dmg
            build/packages/*.exe
            build/packages/*.tar.gz
   Build-Emscripten:
    needs: pack-assets
    runs-on: ubuntu-latest
    environment: prod
    container:
      image: emscripten/emsdk:4.0.18
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          path: repo
          submodules: recursive
      - name: Download packed assets
        uses: actions/download-artifact@v7
        with:
          name: etf-assets
          path: repo
      - name: Debug filesystem
        run: |
          pwd
          ls -R .
          find . -name etf.sg -print
      - name: Install CMake
        run: |
          apt update -y && apt upgrade -y
          apt install cmake pkg-config  -y
      - name: Build dependencies
        run: |
          embuilder build sdl3 freetype ogg libpng vorbis
      - name: Set version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.2.0" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Actual build
        run: cd repo && make BUILD_TYPE=Release IMGUI_DEBUGGING=OFF SYSTEM_PACKAGES=OFF STEAM_ENABLED=OFF ENGINE_CACHED=OFF GAME_VERSION=${{ steps.version.outputs.value }} erebuild
      - uses: actions/upload-artifact@v7
        name: Upload to S3
        with:
          name: s3Artifact
          path: repo/build/Release
   Push-Files-To-S3:
    uses: supergoongaming/sharedWorkflows/.github/workflows/push_to_s3.yml@master
    needs: Build-Emscripten
    secrets:
      IAM_SECRET: ${{ secrets.IAM_SECRET }}
    with:
      IAM_USER: ${{ vars.IAM_USER }}
      bucket_region: "us-east-1"
      bucket_name: "etf-dev-external-site"
   Build-Steam:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack-assets
    strategy:
      matrix:
        include:
          - os: windows-2025
            make_cmd: wsteamrebuild
            name: steam-win
            imgui: OFF
          - os: macos-latest
            make_cmd: xsteamrebuild
            name: steam-mac
            imgui: OFF
          - os: ubuntu-latest
            make_cmd: bsteamrebuild
            name: steam-linux
            imgui: OFF
          - os: windows-2025
            make_cmd: wsteamrebuild
            name: steam-win-debug
            imgui: ON
          - os: macos-latest
            make_cmd: xsteamrebuild
            name: steam-mac-debug
            imgui: ON
          - os: ubuntu-latest
            make_cmd: bsteamrebuild
            name: steam-linux-debug
            imgui: ON
    runs-on: ${{ matrix.os }}
    environment: prod
    steps:
      - name: Checkout ETF repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download packed assets
        uses: actions/download-artifact@v7
        with:
          name: etf-assets
          path: .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.IAM_USER }}
          aws-secret-access-key: ${{ secrets.IAM_SECRET }}
          aws-region: us-east-1
      - name: Download Steam SDK redistributables
        run: |
          aws s3 cp s3://etf-dev-external-site/steam-sdk/redistributable_bin.zip redistributable_bin.zip
          mkdir -p steam-sdk
          unzip redistributable_bin.zip -d steam-sdk/
        shell: bash
      - name: Install dependencies (Ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update -y
          sudo apt-get install build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev libxtst-dev
      - name: Set version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.2.0" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Build with Steam enabled
        run: make BUILD_TYPE=Release IMGUI_DEBUGGING=${{ matrix.imgui }} ENGINE_CACHED=OFF SYSTEM_PACKAGES=OFF GAME_VERSION=${{ steps.version.outputs.value }} STEAM_SDK_DIR=$(pwd)/steam-sdk/redistributable_bin ${{ matrix.make_cmd }}
        shell: bash
      - name: Upload Steam build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-packages
          path: build/install/
   Upload-Steam:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: Build-Steam
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repo (for VDF files)
        uses: actions/checkout@v7
      - name: Download all Steam build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "steam-*-packages"
          path: steam-builds
      - name: Debug downloaded artifacts
        run: |
          find steam-builds -type f
      - name: Set version from tag
        id: version
        run: |
          echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install SteamCMD
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          mkdir -p ~/steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar -xz -C ~/steamcmd
      - name: Write Steam config.vdf
        run: |
          mkdir -p ~/Steam/config
          echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 -d > ~/Steam/config/config.vdf
      - name: Upload Release to Steam
        run: |
          ~/steamcmd/steamcmd.sh \
            +login "${{ secrets.STEAM_USERNAME }}" \
            +run_app_build "${{ github.workspace }}/.github/steam/app_4393160_release.vdf" \
            +quit
        env:
          STEAM_BUILD_DESC: "v${{ steps.version.outputs.value }}"
      - name: Upload Debug to Steam
        run: |
          ~/steamcmd/steamcmd.sh \
            +login "${{ secrets.STEAM_USERNAME }}" \
            +run_app_build "${{ github.workspace }}/.github/steam/app_4393160_debug.vdf" \
            +quit
        env:
          STEAM_BUILD_DESC: "v${{ steps.version.outputs.value }}-debug"
   Create-Release:
    if: startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - Build-Desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: win-packages
          path: artifacts
      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: mac-packages
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: artifacts
      - name: Debug downloaded artifacts
        run: |
          pwd
          find artifacts -type f
          ls -R artifacts
      - name: Get current tag annotation
        id: tag-data
        run: |
          {
            echo 'annotation<<EOF'
            git for-each-ref "${GITHUB_REF}" --format '%(contents)'
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: ${{ steps.tag-data.outputs.annotation }}
