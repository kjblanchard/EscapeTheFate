plugins {
    id 'com.android.application'
}

android {
    namespace 'com.supergoon.rpg'
    compileSdk 34

    defaultConfig {
        applicationId "com.supergoon.rpg"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.2.0"

        externalNativeBuild {
            cmake {
                arguments "-DENGINE_CACHED=ON",
                          "-DIMGUI_DEBUGGING=OFF",
                          "-DDEBUG_ASAN=OFF",
                          "-DSYSTEM_PACKAGES=OFF",
                          "-DPRELOAD_ALL_ASSETS=ON",
                          "-DSDL_BACKEND=ON",
                          "-DSDL_GL=ON",
                          "-DSDL_RENDERER=OFF",
                          "-DSTEAM_ENABLED=OFF",
                          "-DLINK_M=OFF",
                          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
                targets "EscapeTheFate"
                cppFlags "-std=c++23"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.28.0+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}
