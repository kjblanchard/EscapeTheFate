plugins {
    id 'com.android.application'
}

android {
    namespace 'com.supergoon.rpg'
    compileSdk 34

    defaultConfig {
        applicationId "com.supergoon.rpg"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.2.0"

        externalNativeBuild {
            cmake {
                arguments "-DENGINE_CACHED=ON",
                          "-DIMGUI_DEBUGGING=OFF",
                          "-DDEBUG_ASAN=OFF",
                          "-DSYSTEM_PACKAGES=OFF",
                          "-DPRELOAD_ALL_ASSETS=ON",
                          "-DSDL_BACKEND=ON",
                          "-DSDL_GL=ON",
                          "-DSDL_RENDERER=OFF",
                          "-DSTEAM_ENABLED=OFF",
                          "-DLINK_M=OFF",
                          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
                          "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF"
                targets "EscapeTheFate"
                cppFlags "-std=c++23"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.28.0+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

tasks.register('copySDL3JavaSources') {
    def destDir = file("src/main/java/org/libsdl/app")
    def cxxDir = file(".cxx")

    outputs.dir destDir
    doLast {
        if (destDir.exists() && destDir.listFiles()?.length > 0) {
            return
        }
        def sdlJavaDir = null
        if (cxxDir.exists()) {
            cxxDir.eachFileRecurse { f ->
                if (f.path.contains("sdl3-src/android-project/app/src/main/java/org/libsdl/app") && f.isDirectory()) {
                    sdlJavaDir = f
                }
            }
        }
        if (sdlJavaDir != null) {
            copy {
                from sdlJavaDir
                into destDir
            }
            logger.lifecycle("Copied SDL3 Java sources from ${sdlJavaDir}")
        } else {
            throw new GradleException("SDL3 Java sources not found in .cxx/. CMake may not have run yet. Try building again.")
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.matches("compile.*JavaWithJavac") }.configureEach {
        dependsOn 'copySDL3JavaSources'
    }
    tasks.matching { it.name.matches("configureCMake.*") }.each { cmakeTask ->
        tasks.named('copySDL3JavaSources').get().mustRunAfter(cmakeTask)
    }
}

dependencies {
}
